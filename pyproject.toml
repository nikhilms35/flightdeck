[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flightdeck-gcs"
version = "0.4.0"
description = "Lightweight desktop ground control station for ArduPilot, in Python/Qt"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md"]
authors = [{ name = "NIKHIL M S" }]
keywords = ["ardupilot", "mavlink", "ground control station", "drone", "uav"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Environment :: X11 Applications :: Qt",
  "Topic :: Scientific/Engineering",
  "Intended Audience :: Science/Research",
]
dependencies = [
  "PySide6>=6.6",
  "pymavlink>=2.4.40",
  "pyserial>=3.5",
  "pyqtgraph>=0.13",
  "numpy",
]

[project.urls]
Homepage = "https://github.com/nikhilms35/flightdeck"
Issues = "https://github.com/nikhilms35/flightdeck/issues"

[project.scripts]
flightdeck = "flightdeck.__main__:main"

[tool.setuptools]
packages = ["flightdeck", "flightdeck.pages"]
include-package-data = true

[tool.setuptools.package-data]
flightdeck = ["assets/**/*"]
